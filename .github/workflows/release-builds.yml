name: Release Builds (Windows + macOS)

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    if: github.event.release.target_commitish == 'main'
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Prepare embedded PostgreSQL client
        shell: pwsh
        run: |
          function Find-NewestPgDump {
            $candidates = @()
            foreach ($root in @("$env:ProgramFiles\PostgreSQL", "${env:ProgramFiles(x86)}\PostgreSQL")) {
              if (Test-Path $root) {
                $candidates += Get-ChildItem $root -Filter pg_dump.exe -Recurse -File -ErrorAction SilentlyContinue
              }
            }
            $fromPath = Get-Command pg_dump.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1
            if ($fromPath) { $candidates += Get-Item $fromPath }

            $usable = foreach ($candidate in $candidates | Sort-Object FullName -Unique) {
              $bin = $candidate.DirectoryName
              if (-not (Test-Path (Join-Path $bin 'pg_restore.exe')) -or
                  -not (Test-Path (Join-Path $bin 'psql.exe')) -or
                  -not (Test-Path (Join-Path $bin 'libpq.dll'))) { continue }
              $versionText = & $candidate.FullName --version 2>$null
              $match = [regex]::Match("$versionText", '\d+(?:\.\d+){0,3}')
              if ($LASTEXITCODE -eq 0 -and $match.Success) {
                [pscustomobject]@{ Path = $candidate.FullName; Version = [version]$match.Value }
              }
            }
            $usable | Sort-Object Version -Descending | Select-Object -ExpandProperty Path -First 1
          }

          $pgDump = Find-NewestPgDump
          if (-not $pgDump) {
            choco install postgresql -y --no-progress --params "'/Password:GentGranBuildOnly'"
            $pgDump = Find-NewestPgDump
          }
          if (-not $pgDump) { Write-Error 'pg_dump could not be prepared for embedding'; exit 1 }
          Write-Host "Embedding $(& $pgDump --version) from $pgDump"
          "GENTGRAN_PG_DUMP=$pgDump" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set app version from tag
        shell: pwsh
        run: |
          $version = "${env:RELEASE_TAG}" -replace '^[vV]', ''
          Set-Content -Path src\version.py -Value "APP_VERSION = `"$version`"" -Encoding UTF8

      - name: Build Windows app (one-file)
        run: pyinstaller pyinstaller-win.spec --noconfirm

      - name: Install NSIS
        run: choco install nsis -y

      - name: Add NSIS to PATH
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path $nsis)) { $nsis = Join-Path ${env:ProgramFiles} 'NSIS' }
          if (-not (Test-Path $nsis)) { Write-Error 'NSIS not found after install'; exit 1 }
          $nsis | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Locate one-file EXE and tag-rename
        shell: pwsh
        run: |
          $exePath = Join-Path $PWD 'dist\GentGranBD.exe'
          if (-not (Test-Path $exePath -PathType Leaf)) {
            Write-Error 'Expected one-file build at dist\GentGranBD.exe. Refusing to package a one-folder stub without its runtime DLLs.'
            exit 1
          }
          $dest = Join-Path $PWD ("GentGranBD-Windows-${env:RELEASE_TAG}.exe")
          Copy-Item $exePath $dest -Force

          # Build NSIS installer from the found EXE
          makensis -DVERSION="${env:RELEASE_TAG}" -DAPP_EXE="$exePath" installer\installer.nsi

          $setup = Get-ChildItem -Path installer -Filter 'GentGranBD-Setup-*.exe' -File | Select-Object -First 1
          if (-not $setup) { $setup = Get-ChildItem -Path . -Filter 'GentGranBD-Setup-*.exe' -File | Select-Object -First 1 }
          if (-not $setup) { Write-Error 'Installer not found after NSIS'; exit 1 }
          $setupDest = Join-Path $PWD ("GentGranBD-Setup-Windows-${env:RELEASE_TAG}.exe")
          Move-Item $setup.FullName $setupDest -Force

          Get-FileHash -Algorithm SHA256 $dest | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $dest -Leaf)" } | Set-Content "$dest.sha256"
          Get-FileHash -Algorithm SHA256 $setupDest | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $setupDest -Leaf)" } | Set-Content "$setupDest.sha256"

      - name: Upload assets to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            GentGranBD-Windows-${{ env.RELEASE_TAG }}.exe
            GentGranBD-Windows-${{ env.RELEASE_TAG }}.exe.sha256
            GentGranBD-Setup-Windows-${{ env.RELEASE_TAG }}.exe
            GentGranBD-Setup-Windows-${{ env.RELEASE_TAG }}.exe.sha256

  build-macos:
    if: github.event.release.target_commitish == 'main'
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install pyinstaller

      - name: Prepare embedded PostgreSQL client
        run: |
          brew install libpq
          echo "GENTGRAN_PG_DUMP=$(brew --prefix libpq)/bin/pg_dump" >> "$GITHUB_ENV"

      - name: Set app version from tag
        run: |
          VERSION="${RELEASE_TAG#v}"
          VERSION="${VERSION#V}"
          printf 'APP_VERSION = "%s"\n' "$VERSION" > src/version.py

      - name: Build macOS .app
        run: |
          pyinstaller pyinstaller-mac.spec --noconfirm

      - name: Package .app as zip
        run: |
          APP_PATH="dist/GentGranBD.app"
          if [ ! -d "$APP_PATH" ]; then echo "App not found at $APP_PATH"; exit 1; fi
          ZIP_NAME="GentGranBD-macOS-${RELEASE_TAG}.zip"
          # Preserve bundle structure and metadata
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_NAME"
          shasum -a 256 "$ZIP_NAME" | awk '{print $1 "  " $2}' > "$ZIP_NAME.sha256"

      - name: Upload asset to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            GentGranBD-macOS-${{ env.RELEASE_TAG }}.zip
            GentGranBD-macOS-${{ env.RELEASE_TAG }}.zip.sha256
